# set -g default-terminal "screen-256color"
# set-option -g default-terminal "screen-256color"
set-option -g default-shell /usr/bin/zsh
set -g status-bg default
set -g status-fg white
set -g mouse on
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",alacritty:RGB"
setw -g mode-keys vi
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

bind-key          [ copy-mode
set-option -g allow-rename off
bind-key          , command-prompt "rename-window '%%'"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r C-h resize-pane -L 2
bind -r C-l resize-pane -R 2
bind -r C-k resize-pane -U 2
bind -r C-j resize-pane -D 2
bind -r C choose-window

# swap panes

# Various colors.
set -g status-style fg=colour244
set -g window-status-current-style fg=colour222
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour243

set -g status-left ' [#{session_name}] '
set -g status-left-length 0
set -g status-right ''
set -g status-right-length 0

# Display a clock on the bottom right of the status bar.
set -g status-right '%a %Y-%m-%d %H:%M '
set -g status-right-length 21

bind-key b split-window -v
bind-key v split-window -h
bind-key ) switch-client -p
bind-key ( switch-client -n

bind-key x kill-pane
bind-key a command-prompt -p "New Session:" "new-session -s '%%'"
bind-key K confirm-before -p "Kill Other Sessions? (y/n)" "kill-session -a"
# bind-key X confirm-before -p "Kill Session #W? (y/n)" "kill-session -t \"#W\""
bind-key X confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'"
bind-key -r F run-shell "~/scripts/tmux-sessionizer.sh"
