[colors.cursor]
cursor = "#a5a2a2"
text = "#090300"

[colors.primary]
# background = "#121314"
background = '#111111'
# # background = "#090300" # for the galaxy background
foreground = "#a5a2a2"

[env]
TERM = "xterm-256color"

[font]
size = 19.0

# [window]
# padding = { x = 10, y = 15 }

[font.normal]
family = "Caskaydia Cove Nerd Font"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control"

[[keyboard.bindings]]
chars = "\u0003"
key = "C"
mods = "Control"

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"

[mouse]
hide_when_typing = true

[general]
import = [
  "./ayu_dark-theme.toml",
]

[terminal]

[terminal.shell]
args = ["--login"]
program = "/usr/bin/zsh"


